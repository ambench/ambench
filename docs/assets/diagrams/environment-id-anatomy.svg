<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of an AM-Bench environment ID</title>
  <desc id="desc">The PressButton task, FAHexa robot, absolute end-effector action, PID controller, direct environment, and version tokens are highlighted.</desc>
  <style>
    .heading { font-family: sans-serif; font-size: 34px; font-weight: 700; fill: #152935; }
    .token { font-family: monospace; font-size: 26px; font-weight: 700; fill: #152935; }
    .label { font-family: sans-serif; font-size: 22px; font-weight: 600; fill: #314b5f; }
    .small { font-family: sans-serif; font-size: 19px; font-weight: 400; fill: #526b7a; }
    .line { stroke: #8aa1b1; stroke-width: 3; }
  </style>
  <rect width="1500" height="430" fill="#ffffff"/>
  <text class="heading" x="750" y="48" text-anchor="middle">Environment IDs expose the selected benchmark modules</text>

  <g transform="translate(45 110)">
    <rect x="0" y="0" width="245" height="70" rx="12" fill="#dceef8" stroke="#8aa1b1" stroke-width="2"/>
    <text class="token" x="122" y="45" text-anchor="middle">PressButton</text>
    <text class="token" x="304" y="45">-Am-</text>
    <rect x="380" y="0" width="260" height="70" rx="12" fill="#e8e2f6" stroke="#8aa1b1" stroke-width="2"/>
    <text class="token" x="510" y="45" text-anchor="middle">FAHexa</text>
    <rect x="656" y="0" width="105" height="70" rx="12" fill="#fff4d6" stroke="#8aa1b1" stroke-width="2"/>
    <text class="token" x="708" y="45" text-anchor="middle">-Abs-</text>
    <rect x="777" y="0" width="110" height="70" rx="12" fill="#fae8e8" stroke="#8aa1b1" stroke-width="2"/>
    <text class="token" x="832" y="45" text-anchor="middle">PID</text>
    <text class="token" x="901" y="45">-Direct-</text>
    <rect x="1052" y="0" width="85" height="70" rx="12" fill="#e7f3e8" stroke="#8aa1b1" stroke-width="2"/>
    <text class="token" x="1095" y="45" text-anchor="middle">v0</text>

    <line class="line" x1="122" y1="70" x2="122" y2="150"/>
    <line class="line" x1="510" y1="70" x2="510" y2="150"/>
    <line class="line" x1="708" y1="70" x2="708" y2="150"/>
    <line class="line" x1="832" y1="70" x2="832" y2="150"/>
    <line class="line" x1="963" y1="70" x2="963" y2="150"/>
    <line class="line" x1="1095" y1="70" x2="1095" y2="150"/>

    <text class="label" x="122" y="184" text-anchor="middle">Task</text>
    <text class="small" x="122" y="214" text-anchor="middle">scene + success</text>
    <text class="label" x="510" y="184" text-anchor="middle">Robot</text>
    <text class="small" x="510" y="214" text-anchor="middle">FA-Hexa profile</text>
    <text class="label" x="708" y="184" text-anchor="middle">Action</text>
    <text class="small" x="708" y="214" text-anchor="middle">absolute EE</text>
    <text class="label" x="832" y="184" text-anchor="middle">Controller</text>
    <text class="small" x="832" y="214" text-anchor="middle">PID tracking</text>
    <text class="label" x="963" y="184" text-anchor="middle">API</text>
    <text class="small" x="963" y="214" text-anchor="middle">DirectRLEnv</text>
    <text class="label" x="1095" y="184" text-anchor="middle">Version</text>
    <text class="small" x="1095" y="214" text-anchor="middle">Gym suffix</text>
  </g>

  <text class="small" x="750" y="397" text-anchor="middle">Not every Cartesian product is registered; query the live Gym registry for supported combinations.</text>
</svg>
