[project]
name = "ambench"
version = "0.1.0"
description = "Workspace dependencies for AM-Bench, an Isaac Lab benchmark suite for aerial manipulation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The AM-Bench Contributors" }]
maintainers = [{ name = "The AM-Bench Contributors" }]
keywords = [
    "aerial-manipulation",
    "benchmark",
    "imitation-learning",
    "isaaclab",
    "robotics",
    "simulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=1.12.0",
    "av>=14.4.0",
    "casadi>=3.7.2",
    "click>=8.1.7",
    "dill>=0.4.0",
    "diffusers==0.36.0",
    "einops>=0.8.1",
    "hydra-core>=1.3.2",
    "imagecodecs>=2026.1.1",
    "imageio>=2.37.0",
    "matplotlib>=3.10.3",
    "moviepy>=2.2.1",
    "numcodecs==0.11.0",
    "omegaconf>=2.3.0",
    "opencv-python-headless>=4.11.0.86",
    "pandas>=2.3.3",
    "pyarrow>=18.0.0",
    "pyyaml>=6.0.2",
    "scipy>=1.15.3",
    "threadpoolctl>=3.6.0",
    "timm>=1.0.24",
    "tqdm>=4.67.1",
    "wandb>=0.23.1",
    "yourdfpy>=0.0.58",
    "zarr==2.16.0",
]

[project.urls]
Homepage = "https://ambench.github.io/"
Repository = "https://github.com/ambench/ambench"
Documentation = "https://ambench.github.io/docs/"
Issues = "https://github.com/ambench/ambench/issues"
Paper = "https://arxiv.org/abs/2609.00641"

[tool.isort]
known_third_party = ["datasets"]
# The packages live under source/, so isort cannot infer them from the repo
# root. Declaring them keeps their imports in the trailing first-party block
# instead of being merged in with isaaclab and the rest of the third party.
known_first_party = ["ambench", "ambench_learn"]
