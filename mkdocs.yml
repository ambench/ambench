      - Robots and Profiles: configure/robots-and-profiles.md
      - Actions, Observations, and Cameras: configure/actions-observations-and-cameras.md
      - Controllers and Control Pipelines: configure/controllers-and-control-pipelines.md
      - Physics, Disturbances, and Randomization: configure/physics-disturbances-and-randomization.md
  - Evaluate and Reproduce:
      - Evaluate a Supported Policy: evaluation/index.md
      - Configure Evaluation: evaluation/configure.md
      - Evaluation Outputs: reference/evaluation.md
      - Reproduce Research Workflows: evaluation/reproduce.md
      - Supported Policies: policies/index.md
      - Scripted Policies: policies/scripted-policies.md
      - ACT: policies/act.md
      - Diffusion Policy: policies/diffusion-policy.md
      - OpenPI: policies/openpi.md
  - Reference:
