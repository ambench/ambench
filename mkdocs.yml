        benchmark/tasks.md: configure/tasks-and-scenes.md
        benchmark/robots.md: configure/robots-and-profiles.md
        benchmark/interfaces.md: configure/actions-observations-and-cameras.md
        benchmark/physics.md: configure/physics-disturbances-and-randomization.md
