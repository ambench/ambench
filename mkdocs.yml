site_name: AM-Bench Documentation
site_description: A modular simulation suite and benchmark for aerial manipulation policy learning
site_url: https://ambench.github.io/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

copyright: AM-Bench contributors, 2026

nav:
  - Project Website: https://ambench.github.io/
  - Home: index.md
  - Get Started:
      - Installation: getting-started/installation.md
      - Verify Installation: getting-started/first-run.md
      - Find an Environment: getting-started/find-an-environment.md
  - Use AM-Bench:
